# Servidor de red LoRaWAN (ChirpStack v4), basado en github.com/chirpstack/chirpstack-docker.
# Lo incluye el docker-compose.yml de la raíz, así que todo se levanta con un solo `docker compose up`.
#
#   Interfaz web de ChirpStack  → http://localhost:8080  (usuario admin / admin)
#   API REST (Postman)          → http://localhost:8090
#   Gateway Bridge (UDP)        → puerto 1700: aquí apuntará el gateway real
#   Simulador (Postman)         → http://localhost:8070: gateway + nodo virtuales, mientras no hay gateway
#
# Región: US915 sub-banda 2 (canales 8–15), la misma que usa el nodo (LORAWAN_SUB_BANDA 2).

services:
  chirpstack:
    image: chirpstack/chirpstack:4
    command: -c /etc/chirpstack
    restart: unless-stopped
    volumes:
      - ./configuration/chirpstack:/etc/chirpstack
    depends_on:
      - chirpstack-postgres
      - chirpstack-redis
      - mosquitto
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - REDIS_HOST=chirpstack-redis
      - POSTGRESQL_HOST=chirpstack-postgres
    ports:
      - "8080:8080"

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    ports:
      - "1700:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    environment:
      - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=us915_1/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=us915_1/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=us915_1/gateway/{{ .GatewayID }}/command/#
    depends_on:
      - mosquitto

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    ports:
      - "8090:8090"
    depends_on:
      - chirpstack

  chirpstack-postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    volumes:
      - ./configuration/postgresql/initdb:/docker-entrypoint-initdb.d
      - chirpstack_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=chirpstack
      - POSTGRES_DB=chirpstack

  chirpstack-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - chirpstack_redis_data:/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./configuration/mosquitto/config/:/mosquitto/config/

  # Gateway y nodo virtuales para probar sin hardware (ver simulador/simulador.py)
  simulador-lorawan:
    build: ./simulador
    restart: unless-stopped
    environment:
      - BRIDGE_HOST=chirpstack-gateway-bridge
      - GATEWAY_EUI=0016C001FF10A235
    ports:
      - "8070:8070"
    depends_on:
      - chirpstack-gateway-bridge

volumes:
  chirpstack_postgres_data:
  chirpstack_redis_data:
